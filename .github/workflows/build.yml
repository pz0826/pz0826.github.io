name: Check homepage
on:
  push:
    branches: [feat/artistic-homepage]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:assets
      - run: npm run check:arts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: dist/
          retention-days: 7
