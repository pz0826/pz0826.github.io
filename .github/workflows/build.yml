name: Build and deploy homepage
on:
  push:
    branches: [feat/artistic-homepage]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:assets
      - run: npm run check:arts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: dist/
          retention-days: 7
      - name: Upload static site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/artistic-homepage'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/artistic-homepage'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v4
